name: Auto-Update Game Data

# Runs hourly. If erkul PTU data has changed since the last build,
# fetches fresh data, bumps the patch version, builds a new SCCT.exe,
# publishes a GitHub Release, and notifies via Discord + GitHub email.

on:
  schedule:
    - cron: '0 * * * *'   # every hour at :00
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if erkul data is unchanged'
        type: boolean
        default: false

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to push commits and create releases

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: pwsh

      # ------------------------------------------------------------------
      # 3. Check whether erkul data has changed
      # ------------------------------------------------------------------
      - name: Check for new erkul data
        id: check
        shell: pwsh
        run: |
          python scripts/fetch_erkul_data.py --check-only
          $changed = ($LASTEXITCODE -eq 1)
          echo "changed=$changed" >> $env:GITHUB_OUTPUT
          if ($changed) {
            Write-Host "Data has CHANGED — proceeding with build."
          } else {
            Write-Host "Data is UNCHANGED — skipping build."
          }

      # ------------------------------------------------------------------
      # 4. Fetch fresh erkul data  (only if changed or forced)
      # ------------------------------------------------------------------
      - name: Fetch erkul data
        if: steps.check.outputs.changed == 'True' || inputs.force_build
        shell: pwsh
        run: python scripts/fetch_erkul_data.py

      # ------------------------------------------------------------------
      # 5. Bump patch version and commit updated data
      # ------------------------------------------------------------------
      - name: Bump version and commit
        id: version
        if: steps.check.outputs.changed == 'True' || inputs.force_build
        shell: pwsh
        run: |
          # Read current version (format: MAJOR.MINOR.PATCH)
          $ver = (Get-Content version.txt).Trim()
          $parts = $ver.Split('.')
          $parts[2] = [string]([int]$parts[2] + 1)
          $new_ver = $parts -join '.'
          Set-Content version.txt "$new_ver`n"

          $tag = "v$new_ver"
          echo "new_version=$new_ver" >> $env:GITHUB_OUTPUT
          echo "tag=$tag"            >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver -> $new_ver  (tag: $tag)"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/erkul_data.json version.txt
          git commit -m "chore: auto-update erkul game data ($tag)"
          git push

      # ------------------------------------------------------------------
      # 6. Build SCCT.exe with PyInstaller
      # ------------------------------------------------------------------
      - name: Build exe
        if: steps.check.outputs.changed == 'True' || inputs.force_build
        shell: pwsh
        run: |
          pyinstaller `
            --onefile --noconsole `
            --add-data "app/templates;app/templates" `
            --add-data "app/static;app/static" `
            --add-data "data;data" `
            --hidden-import waitress `
            --name SCCT `
            run_packaged.py

      # ------------------------------------------------------------------
      # 7. Create GitHub Release
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        if: steps.check.outputs.changed == 'True' || inputs.force_build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag     = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.new_version }}"
          $notes   = @"
          ## SCCT $tag — Automated Game Data Update

          This release was built automatically after new data was detected on erkul.games PTU.

          **What changed:** Component and loadout data updated to the latest PTU patch.
          **User data:** Your hangar, loadout, and inventory data are preserved automatically — just replace the exe.

          Download SCCT.exe below.
          "@
          gh release create $tag dist/SCCT.exe `
            --title "SCCT $tag" `
            --notes $notes `
            --latest

      # ------------------------------------------------------------------
      # 8. Discord notification  (always runs — reports success or failure)
      # SETUP REQUIRED: Add your Discord webhook URL as a GitHub secret
      # named DISCORD_WEBHOOK_URL. To create one:
      #   Discord server → Settings → Integrations → Webhooks → New Webhook
      #   Copy the URL → GitHub repo → Settings → Secrets → New secret
      # ------------------------------------------------------------------
      - name: Notify Discord
        if: always()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          $changed  = "${{ steps.check.outputs.changed }}"
          $tag      = "${{ steps.version.outputs.tag }}"
          $job_url  = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $rel_url  = "https://github.com/${{ github.repository }}/releases/latest"

          # Determine overall outcome
          $build_ran = ($changed -eq 'True') -or ('${{ inputs.force_build }}' -eq 'true')

          if (-not $build_ran) {
            $color       = 6842623          # grey-blue
            $title       = "SCCT: No update needed"
            $description = "Erkul data is unchanged. No build triggered."
          } elseif ('${{ job.status }}' -eq 'success') {
            $color       = 5763719          # green
            $title       = "SCCT $tag released!"
            $description = "New game data detected and built successfully. [Download here]($rel_url)"
          } else {
            $color       = 15548997         # red
            $title       = "SCCT build FAILED"
            $description = "A new build was triggered but failed. [View logs]($job_url)"
          }

          $payload = @{
            username = "SCCT Build Bot"
            embeds   = @(@{
              title       = $title
              description = $description
              color       = $color
              url         = $job_url
              footer      = @{ text = "Lucky44/SCCT-DB • ${{ github.run_id }}" }
            })
          } | ConvertTo-Json -Depth 5

          if ($env:DISCORD_WEBHOOK_URL) {
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post `
              -ContentType 'application/json' -Body $payload
          } else {
            Write-Host "DISCORD_WEBHOOK_URL secret not set — skipping Discord notification."
          }
