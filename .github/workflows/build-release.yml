name: Build & Release

# Trigger: push a version tag like "v1.0" or "v1.2.3"
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller SCCT.spec

      - name: Create or update GitHub Release
        run: |
          $tag = "${{ github.ref_name }}"
          $exe  = "dist\SCCT.exe"
          $body = @"
          ## SC Component Tracker $tag

          **Download:** ``SCCT.exe`` below

          **First-time setup:** Run ``SCCT.exe`` — your browser opens automatically. Click **Update Game Data** on the Dashboard to import ships and components.

          **Your data** is saved next to the exe and will not be affected by updates.
          "@

          # Create release if it doesn't exist yet; ignore error if it already does
          gh release create $tag $exe --title "SCCT-DB $tag" --notes $body --latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            # Release already exists (created by release.sh) — just upload/replace the exe
            gh release upload $tag $exe --clobber
          }
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
